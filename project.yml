name: HealthLab
options:
  bundleIdPrefix: com.dechhts
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
packages:
  LabParser:
    path: Packages/LabParser
targets:
  HealthLab:
    type: application
    platform: iOS
    sources:
      - HealthLab
    dependencies:
      - package: LabParser
    info:
      path: HealthLab/Info.plist
      properties:
        CFBundleDisplayName: 体检记
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: 用于扫描纸质体检报告，识别在手机本地完成。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dechhts.healthlab
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  HealthLab:
    build:
      targets:
        HealthLab: all
